name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example v1.1.0)
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Resolve tag
        id: version
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          PUSHED_TAG: ${{ github.ref_name }}
        run: echo "tag=${REQUESTED_TAG:-$PUSHED_TAG}" >> "$GITHUB_OUTPUT"

      - name: Check out tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify version and quality
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          test "v$PACKAGE_VERSION" = "$RELEASE_TAG" || {
            echo "package.json version ($PACKAGE_VERSION) does not match $RELEASE_TAG"
            exit 1
          }
          bun run check
          bun run build

  build:
    name: Build / ${{ matrix.label }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            runner: ubuntu-latest
            target: bun-linux-x64
            artifact: oc-evict-linux-x64
          - label: Windows x64
            runner: windows-latest
            target: bun-windows-x64
            artifact: oc-evict-windows-x64.exe
          - label: macOS x64
            runner: macos-15-intel
            target: bun-darwin-x64
            artifact: oc-evict-darwin-x64
          - label: macOS arm64
            runner: macos-latest
            target: bun-darwin-arm64
            artifact: oc-evict-darwin-arm64

    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate version file
        run: bun run gen:version

      - name: Build binary
        shell: bash
        run: bun build src/index.ts --compile --minify --target=${{ matrix.target }} --outfile=${{ matrix.artifact }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          generate_release_notes: true
          files: release-assets/*

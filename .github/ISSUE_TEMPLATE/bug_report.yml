name: Bug report
description: Report reproducible behavior that does not work as expected.
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Evict. Remove tokens and private paths from logs before submitting.
  - type: input
    id: version
    attributes:
      label: Evict version
      description: Run `oc-evict --version`.
      placeholder: 1.0.22
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux, Other]
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime
      description: Include the Bun or Node version and installation method.
      placeholder: Bun 1.3.14, installed with bun add --global
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Run ...
        2. Enable ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Prefer output from `oc-evict --dry-run --ci`. Remove credentials first.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Preflight checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed API keys, bearer tokens, and private paths from the report.
          required: true

